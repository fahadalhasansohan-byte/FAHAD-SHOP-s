<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#20232a;font-family:Arial,"Noto Sans Bengali",sans-serif;padding-bottom:78px}header{background:#c81045;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px #0002}.topbar{height:78px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.icon-btn{border:0;background:none;font-size:28px;color:#263238;position:relative}.logo{height:62px;display:flex;align-items:center;gap:5px;color:#c81045;font-size:25px;position:relative}.logo .zs{font-size:47px;font-weight:900;color:#111;line-height:1}.logo small{font-size:13px;color:#111;position:absolute;left:36px;bottom:4px}.badge{position:absolute;right:-5px;top:-3px;background:#c81045;color:#fff;border-radius:20px;font-size:11px;padding:3px 6px}.search-wrap{display:flex;background:#c81045;padding:14px 28px}.search-wrap input{width:100%;height:50px;border:0;border-radius:9px 0 0 9px;padding:0 16px;font-size:16px;outline:0}.search-wrap button{width:60px;border:0;background:#111;color:#fff;border-radius:0 9px 9px 0;font-size:29px}.hero{margin:28px 14px 20px;border-radius:15px;overflow:hidden;background:linear-gradient(110deg,#eaf6ff,#c7e6f5);height:220px;position:relative}.slide{height:100%;display:flex;align-items:center;justify-content:space-around;padding:20px 25px}.slide h2{margin:7px 0;font-size:24px}.slide p{margin:5px 0 14px}.slide button,.owner-btn,.checkout{border:0;background:#c81045;color:#fff;border-radius:20px;padding:10px 18px;font-weight:700}.hero-art{font-size:55px}.dots{position:absolute;bottom:10px;left:0;right:0;text-align:center}.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin:3px}.card{background:#fff;border-radius:17px;margin:14px;padding:16px;box-shadow:0 1px 6px #0000000d}.section-head{display:flex;align-items:center;gap:8px;margin-bottom:13px}.section-head h2{font-size:21px;margin:0;flex:1}.section-head a{color:#b20c3d;font-weight:bold;text-decoration:none}.timer{background:#c81045;color:#fff;padding:7px 9px;border-radius:7px;font-weight:bold;font-size:13px}.product-row{display:flex;overflow-x:auto;gap:12px;padding-bottom:4px}.product-row .product{min-width:205px}.product-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product{background:#fff;border:1px solid #eee;border-radius:13px;padding:9px;position:relative;overflow:hidden}.pic{height:145px;border-radius:10px;background:linear-gradient(135deg,#fafafa,#eef1f4);display:flex;align-items:center;justify-content:center;font-size:55px}.discount{position:absolute;top:9px;left:9px;background:#c81045;color:#fff;padding:5px 8px;border-radius:5px;font-size:12px}.product h3{font-size:14px;margin:9px 3px 5px;height:36px;overflow:hidden}.rating{font-size:12px;color:#a7a7a7}.price{font-weight:bold;color:#c81045;font-size:18px;margin:6px 3px}.old{text-decoration:line-through;color:#999;font-size:12px;margin-left:5px}.add{width:100%;background:#c81045;color:#fff;border:0;border-radius:8px;padding:9px;font-weight:bold}.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.cat{border:0;background:#f8eaf0;border-radius:12px;padding:11px 4px;text-align:center;font-size:12px}.cat b{display:block;font-size:28px;margin-bottom:5px}.load-more{display:block;width:100%;margin-top:16px;padding:12px;border:1px solid #c81045;background:#fff;color:#c81045;border-radius:10px;font-weight:bold}.owner{text-align:center;background:#20232a;color:#fff;margin-top:25px;padding:30px 15px 105px}.owner-logo{width:75px;height:75px;margin:auto;border-radius:22px;background:#fff;color:#c81045;display:grid;place-items:center;font-size:28px;font-weight:900;box-shadow:0 8px 20px #0005}.owner h3{margin:12px}.owner p{font-size:12px;color:#ddd}.whatsapp{position:fixed;right:17px;bottom:92px;width:58px;height:58px;border-radius:50%;background:#18b85a;color:#fff;display:grid;place-items:center;text-decoration:none;font-size:34px;font-weight:bold;z-index:30;box-shadow:0 7px 18px #0005;border:4px solid #fff}.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:72px;background:#fff;display:flex;justify-content:space-around;z-index:25;box-shadow:0 -2px 10px #0001}.bottom-nav button{border:0;background:none;color:#5d6670;font-size:25px;display:flex;flex-direction:column;align-items:center;gap:3px}.bottom-nav span{font-size:11px}.bottom-nav .active{color:#c81045}.drawer{position:fixed;left:-290px;top:0;bottom:0;width:275px;background:#fff;z-index:50;padding:20px;box-shadow:5px 0 20px #0003;transition:.25s}.drawer.open{left:0}.drawer button{border:0;background:none;font-size:22px}.drawer h3{margin-top:30px}.drawer-cat{padding:13px;border-bottom:1px solid #eee}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:60;align-items:flex-end}.modal.show{display:flex}.modal-box{background:#fff;width:100%;max-height:80vh;border-radius:20px 20px 0 0;padding:18px;overflow:auto}.modal-head{display:flex;justify-content:space-between}.modal-head button{border:0;background:none;font-size:22px}.cart-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.cart-item .pic{width:70px;height:70px;font-size:30px}.cart-item b{display:block}.qty{margin-top:5px}.qty button{border:1px solid #ddd;background:#fff;padding:3px 9px}.cart-total{font-size:19px;padding:16px 0}.checkout{width:100%;font-size:16px}@media(min-width:700px){main{max-width:900px;margin:auto}.product-grid{grid-template-columns:repeat(4,1fr)}.product-row .product{min-width:210px}.hero{height:260px}}
</style>
</head>
<body>
<header>
  <div class="topbar">
    <button class="icon-btn" id="menuBtn">☰</button>
    <div class="logo"><span class="zs">Z</span><b>ZONE</b><small>SHOP's</small></div>
    <button class="icon-btn" id="cartTop">🛒<span class="badge" id="cartBadge">0</span></button>
  </div>
  <div class="search-wrap">
    <input id="search" placeholder="Search for products..." autocomplete="off">
    <button id="searchBtn">⌕</button>
  </div>
</header>

<main>
  <div id="drawer" class="drawer">
    <button id="closeDrawer">✕</button>
    <h3>Categories</h3>
    <div id="drawerCats"></div>
  </div>

  <section class="hero">
    <div class="slide active">
      <div><small>ZONE SHOP's</small><h2>গরমে স্বস্তি পেতে</h2><p>নতুন কালেকশন এখনই অর্ডার করুন</p><button onclick="scrollToDeals()">ORDER NOW</button></div>
      <div class="hero-art">❄️ 🎧 💨</div>
    </div>
    <div class="dots"><i></i><i></i><i></i></div>
  </section>

  <section class="deals card">
    <div class="section-head"><h2>⚡ Flash Deals</h2><div class="timer" id="timer">04 : 37 : 22</div><a href="#" onclick="showAll();return false">View All</a></div>
    <div id="dealGrid" class="product-row"></div>
  </section>

  <section class="categories card">
    <div class="section-head"><h2>Categories</h2></div>
    <div id="categories" class="cat-grid"></div>
  </section>

  <section class="card products-section">
    <div class="section-head"><h2 id="productTitle">All Products</h2><select id="sort"><option value="default">Sort</option><option value="low">Price: Low</option><option value="high">Price: High</option></select></div>
    <div id="products" class="product-grid"></div>
    <button id="loadMore" class="load-more">Load More</button>
  </section>

  <section class="owner">
    <div class="owner-logo">ZS</div>
    <h3>Website Owner</h3>
    <a class="owner-btn" href="https://www.facebook.com/share/1B3snrYRV6/" target="_blank" rel="noopener">Visit Owner Facebook</a>
    <p>email: zoneshops@gmail.com</p>
  </section>
</main>

<a class="whatsapp" href="https://wa.me/8801845249190?text=Assalamu%20Alaikum%2C%20ZONE%20SHOP's%20থেকে%20পণ্য%20সম্পর্কে%20জানতে%20চাই।" target="_blank" rel="noopener" aria-label="WhatsApp">◔</a>

<nav class="bottom-nav">
  <button class="active" onclick="window.scrollTo({top:0,behavior:'smooth'})">⌂<span>Home</span></button>
  <button onclick="openDrawer()">▦<span>Categories</span></button>
  <button onclick="openCart()">🛒<span>Cart</span></button>
  <button onclick="alert('Wishlist: পণ্যের পাশে ♡ চাপুন')">♡<span>Wishlist</span></button>
  <button onclick="document.querySelector('.owner').scrollIntoView({behavior:'smooth'})">♙<span>Login</span></button>
</nav>

<div id="cartModal" class="modal">
  <div class="modal-box">
    <div class="modal-head"><h2>Your Cart</h2><button onclick="closeCart()">✕</button></div>
    <div id="cartItems"></div>
    <div class="cart-total">Total: <b id="cartTotal">৳0</b></div>
    <button class="checkout" onclick="checkout()">Checkout / Order</button>
  </div>
</div>

<script>

const cats=["All","Electronics","Mobile","Audio","Fashion","Beauty","Home","Gadgets"];
const icons=["🛍️","📱","🎧","👕","💄","🏠","⌚","🎮"];
const names=["Wireless Neckband","Smart Watch Pro","Portable Mini Fan","Bluetooth Speaker","Fast Charging Cable","LED Desk Lamp","Wireless Mouse","Gaming Keyboard","Phone Holder","Power Bank 10000mAh","Smart LED Bulb","Travel Backpack","Premium Sunglasses","Cotton T-Shirt","Kitchen Organizer"];
let products=Array.from({length:150},(_,i)=>({id:i+1,name:names[i%names.length]+" "+(i+1),price:350+(i*137)%9650,old:900+(i*211)%12000,cat:cats[1+i%7],icon:icons[(i+1)%icons.length]}));
let shown=20, selectedCat="All", cart=JSON.parse(localStorage.getItem("zoneCart")||"[]");

function money(n){return "৳"+Number(n).toLocaleString("en-BD",{minimumFractionDigits:2})}
function renderCats(){
 document.getElementById("categories").innerHTML=cats.slice(1).map((c,i)=>`<button class="cat" onclick="filterCat('${c}')"><b>${icons[i+1]}</b>${c}</button>`).join("");
 document.getElementById("drawerCats").innerHTML=cats.map(c=>`<div class="drawer-cat" onclick="filterCat('${c}')">${c}</div>`).join("");
}
function card(p){
 return `<article class="product"><div class="pic">${p.icon}</div><span class="discount">-${10+p.id%25}%</span><h3>${p.name}</h3><div class="rating">☆ ☆ ☆ ☆ ☆ (0)</div><div class="price">${money(p.price)} <span class="old">${money(p.old)}</span></div><button class="add" onclick="addCart(${p.id})">${cart.some(x=>x.id===p.id)?"✓ Added":"Add to Cart"}</button></article>`;
}
function render(){
 let list=products.filter(p=>selectedCat==="All"||p.cat===selectedCat);
 let q=document.getElementById("search").value.trim().toLowerCase();
 if(q)list=list.filter(p=>p.name.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q));
 let s=document.getElementById("sort").value;
 if(s==="low")list.sort((a,b)=>a.price-b.price);
 if(s==="high")list.sort((a,b)=>b.price-a.price);
 document.getElementById("productTitle").textContent=selectedCat==="All"?"All Products":selectedCat;
 document.getElementById("products").innerHTML=list.slice(0,shown).map(card).join("");
 document.getElementById("loadMore").style.display=list.length>shown?"block":"none";
}
function renderDeals(){document.getElementById("dealGrid").innerHTML=products.slice(0,8).map(card).join("")}
function filterCat(c){selectedCat=c;shown=20;render();closeDrawer();document.querySelector(".products-section").scrollIntoView({behavior:"smooth"})}
function showAll(){selectedCat="All";shown=150;render()}
function saveCart(){localStorage.setItem("zoneCart",JSON.stringify(cart));document.getElementById("cartBadge").textContent=cart.reduce((a,b)=>a+b.qty,0)}
function addCart(id){let x=cart.find(i=>i.id===id);x?x.qty++:cart.push({id,qty:1});saveCart();render();renderDeals();openCart()}
function openCart(){renderCart();document.getElementById("cartModal").classList.add("show")}
function closeCart(){document.getElementById("cartModal").classList.remove("show")}
function renderCart(){
 let box=document.getElementById("cartItems");
 if(!cart.length){box.innerHTML="<p>কার্ট খালি।</p>";document.getElementById("cartTotal").textContent="৳0";return}
 let total=0;
 box.innerHTML=cart.map(i=>{
  let p=products.find(x=>x.id===i.id); total+=p.price*i.qty;
  return `<div class="cart-item"><div class="pic">${p.icon}</div><div style="flex:1"><b>${p.name}</b><div>${money(p.price)}</div><div class="qty"><button onclick="changeQty(${p.id},-1)">−</button> ${i.qty} <button onclick="changeQty(${p.id},1)">+</button> <button onclick="removeItem(${p.id})">Remove</button></div></div></div>`;
 }).join("");
 document.getElementById("cartTotal").textContent=money(total);
}
function changeQty(id,n){let x=cart.find(i=>i.id===id);if(!x)return;x.qty+=n;if(x.qty<=0)cart=cart.filter(i=>i.id!==id);saveCart();renderCart();render();renderDeals()}
function removeItem(id){cart=cart.filter(i=>i.id!==id);saveCart();renderCart();render();renderDeals()}
function checkout(){
 if(!cart.length){alert("আগে পণ্য কার্টে যোগ করুন।");return}
 let total=0;
 let lines=cart.map(i=>{let p=products.find(x=>x.id===i.id);total+=p.price*i.qty;return p.name+" x "+i.qty+" = "+money(p.price*i.qty)});
 let text="Assalamu Alaikum, ZONE SHOP's-এ অর্ডার করতে চাই.\n\n"+lines.join("\n")+"\n\nমোট: "+money(total);
 window.open("https://wa.me/8801845249190?text="+encodeURIComponent(text),"_blank");
}
function openDrawer(){document.getElementById("drawer").classList.add("open")}
function closeDrawer(){document.getElementById("drawer").classList.remove("open")}
function scrollToDeals(){document.querySelector(".deals").scrollIntoView({behavior:"smooth"})}

document.getElementById("menuBtn").onclick=openDrawer;
document.getElementById("closeDrawer").onclick=closeDrawer;
document.getElementById("cartTop").onclick=openCart;
document.getElementById("loadMore").onclick=()=>{shown+=20;render()};
document.getElementById("sort").onchange=render;
document.getElementById("search").oninput=render;
document.getElementById("searchBtn").onclick=render;
document.getElementById("cartModal").onclick=e=>{if(e.target.id==="cartModal")closeCart()};

renderCats();renderDeals();render();saveCart();

let end=Date.now()+4*3600e3+37*60e3+22e3;
setInterval(()=>{
 let s=Math.max(0,end-Date.now())/1000,h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=Math.floor(s%60);
 document.getElementById("timer").textContent=[h,m,sec].map(x=>String(x).padStart(2,"0")).join(" : ");
},1000);

</script>
</body>
</html>
